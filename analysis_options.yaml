include: package:lints/recommended.yaml

formatter:
  page_width: 100

analyzer:
  language:
    strict-casts: true
    strict-inference: true
    strict-raw-types: true
  errors:
    todo: ignore
  exclude:
    - build/**

linter:
  rules:
    - public_member_api_docs
    - prefer_final_locals
    - unawaited_futures
    - avoid_dynamic_calls
